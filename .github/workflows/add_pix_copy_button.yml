name: Add PIX copy button
on:
  push:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add copy button without changing PIX generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text()
          s = s.replace(
              'from aiogram.types import BotCommand, CallbackQuery, InlineKeyboardButton, InlineKeyboardMarkup, Message',
              'from aiogram.types import BotCommand, CallbackQuery, CopyTextButton, InlineKeyboardButton, InlineKeyboardMarkup, Message',
              1,
          )
          old = '''def pix_keyboard(order_id: str) -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(inline_keyboard=[\n        [InlineKeyboardButton(text="🔄 Verificar pagamento", callback_data=f"pixcheck:{order_id}")],\n        [InlineKeyboardButton(text="❌ Cancelar", callback_data="back")],\n    ])'''
          new = '''def pix_keyboard(order_id: str, pix_code: str = "") -> InlineKeyboardMarkup:\n    buttons = []\n    if pix_code:\n        buttons.append([InlineKeyboardButton(text="📋 Copiar chave PIX", copy_text=CopyTextButton(text=pix_code))])\n    buttons.append([InlineKeyboardButton(text="🔄 Verificar pagamento", callback_data=f"pixcheck:{order_id}")])\n    buttons.append([InlineKeyboardButton(text="❌ Cancelar", callback_data="back")])\n    return InlineKeyboardMarkup(inline_keyboard=buttons)'''
          if old not in s:
              raise SystemExit('Expected pix_keyboard block not found')
          s = s.replace(old, new, 1)
          old_call = 'await callback.message.answer(text_out, reply_markup=pix_keyboard(order_id))'
          new_call = 'await callback.message.answer(text_out, reply_markup=pix_keyboard(order_id, pix_code))'
          if old_call not in s:
              raise SystemExit('Expected PIX keyboard call not found')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Add one-click PIX copy button'
          git rm .github/workflows/add_pix_copy_button.yml
          git commit -m 'Remove temporary PIX copy workflow'
          git push
