name: Format PIX checkout messages separately

on:
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update PIX message flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text()

          old = '''    text_out = (f"<b>PIX gerado com sucesso</b> ✅\\n\\n<b>Plano:</b> {plan['label']}\\n<b>Valor:</b> R$ {plan['amount_cents']/100:.2f}\\n\\n<b>Código PIX copia e cola:</b>\\n<code>{pix_code}</code>\\n\\nCopie o código, faça o pagamento no seu banco e depois toque em <b>🔄 Verificar pagamento</b>.")
    await callback.message.answer(text_out, reply_markup=pix_keyboard(order_id, pix_code))'''
          new = '''    await callback.message.answer(
        f"<b>PIX gerado com sucesso</b> ✅\\n\\n"
        f"<b>Plano:</b> {plan['label']}\\n"
        f"<b>Valor:</b> R$ {plan['amount_cents']/100:.2f}"
    )
    await callback.message.answer(
        "✅ <b>Como realizar o pagamento:</b>\\n\\n"
        "1. Abra o aplicativo do seu banco.\\n"
        "2. Selecione a opção <b>\\\"Pagar\\\"</b> ou <b>\\\"PIX\\\"</b>.\\n"
        "3. Escolha <b>\\\"PIX Copia e Cola\\\"</b>.\\n"
        "4. Cole a chave que está na mensagem abaixo e finalize o pagamento com segurança."
    )
    await callback.message.answer("Copie o código abaixo:")
    await callback.message.answer(pix_code)
    await callback.message.answer(
        "Após efetuar o pagamento, clique no botão abaixo 👇",
        reply_markup=pix_keyboard(order_id, pix_code),
    )'''
          if old not in s:
              raise SystemExit('current PIX message block not found')
          s = s.replace(old, new, 1)

          old = '''def pix_keyboard(order_id: str, pix_code: str = "") -> InlineKeyboardMarkup:
    buttons = []
    if pix_code:
        buttons.append([InlineKeyboardButton(text="📋 Copiar chave PIX", copy_text=CopyTextButton(text=pix_code))])
    buttons.append([InlineKeyboardButton(text="🔄 Verificar pagamento", callback_data=f"pixcheck:{order_id}")])
    buttons.append([InlineKeyboardButton(text="❌ Cancelar", callback_data="back")])
    return InlineKeyboardMarkup(inline_keyboard=buttons)'''
          new = '''def pix_keyboard(order_id: str, pix_code: str = "") -> InlineKeyboardMarkup:
    buttons = []
    if pix_code:
        buttons.append([InlineKeyboardButton(text="📋 Copiar Código", copy_text=CopyTextButton(text=pix_code))])
    buttons.append([InlineKeyboardButton(text="✅ Verificar Status", callback_data=f"pixcheck:{order_id}")])
    buttons.append([InlineKeyboardButton(text="❌ Cancelar", callback_data="back")])
    return InlineKeyboardMarkup(inline_keyboard=buttons)'''
          if old not in s:
              raise SystemExit('current PIX keyboard block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          python -m py_compile app/main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "Separate PIX checkout messages" 
          git push
