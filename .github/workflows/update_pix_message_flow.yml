name: Format PIX checkout messages separately

on:
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update PIX message flow
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('app/main.py')
          source = path.read_text()
          tree = ast.parse(source)
          lines = source.splitlines(True)

          def replace_function(name, new_body):
              node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if node is None:
                  raise SystemExit(f'function {name} not found')
              start = node.body[0].lineno - 1
              end = node.end_lineno
              indent = ' ' * 4
              replacement = ''.join(indent + line + '\n' for line in new_body.strip('\n').split('\n'))
              lines[start:end] = [replacement]

          replace_function('pix_keyboard', '''buttons = []
          if pix_code:
              buttons.append([InlineKeyboardButton(text="📋 Copiar Código", copy_text=CopyTextButton(text=pix_code))])
          buttons.append([InlineKeyboardButton(text="✅ Verificar Status", callback_data=f"pixcheck:{order_id}")])
          buttons.append([InlineKeyboardButton(text="❌ Cancelar", callback_data="back")])
          return InlineKeyboardMarkup(inline_keyboard=buttons)''')

          # Re-parse after the first replacement so line numbers remain exact.
          source = ''.join(lines)
          tree = ast.parse(source)
          lines = source.splitlines(True)

          node = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == 'choose_plan'), None)
          if node is None:
              raise SystemExit('function choose_plan not found')

          start = node.body[0].lineno - 1
          end = node.end_lineno
          body = '''await callback.answer()
          upsert_user(callback.message)
          plan_key = callback.data.split(":", 1)[1]
          if plan_key not in PLANS:
              await callback.message.answer("Opção inválida. Tente novamente.", reply_markup=plans_keyboard())
              return

          if not configured_pix():
              log.error("BravoPay is not configured on the server")
              await callback.message.answer("O pagamento por PIX está temporariamente indisponível. Tente novamente mais tarde.", reply_markup=keyboard_menu())
              return

          plan = PLANS[plan_key]
          await callback.message.answer("⏳ Gerando seu PIX...")
          try:
              order_id, pix_code = await create_pix_order(callback.from_user.id, plan_key)
          except Exception as exc:
              log.exception("Could not create BravoPay PIX order: %s", exc)
              await callback.message.answer("Não foi possível gerar o PIX agora. Tente novamente em alguns instantes.", reply_markup=plans_keyboard())
              return

          await callback.message.answer(
              f"<b>PIX gerado com sucesso</b> ✅\\n\\n"
              f"<b>Plano:</b> {plan['label']}\\n"
              f"<b>Valor:</b> R$ {plan['amount_cents']/100:.2f}"
          )

          await callback.message.answer(
              "✅ <b>Como realizar o pagamento:</b>\\n\\n"
              "1. Abra o aplicativo do seu banco.\\n"
              "2. Selecione a opção <b>\"Pagar\"</b> ou <b>\"PIX\"</b>.\\n"
              "3. Escolha <b>\"PIX Copia e Cola\"</b>.\\n"
              "4. Cole a chave que está na mensagem abaixo e finalize o pagamento com segurança."
          )

          await callback.message.answer("Copie o código abaixo:")
          await callback.message.answer(pix_code)
          await callback.message.answer(
              "Após efetuar o pagamento, clique no botão abaixo 👇",
              reply_markup=pix_keyboard(order_id, pix_code),
          )'''
          indent = ' ' * 4
          replacement = ''.join(indent + line + '\n' for line in body.strip('\n').split('\n'))
          lines[start:end] = [replacement]

          updated = ''.join(lines)
          ast.parse(updated)
          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git commit -m "Separate PIX checkout into individual messages"
          git rm .github/workflows/update_pix_message_flow.yml
          git commit -m "Remove temporary PIX message workflow"
          git push
