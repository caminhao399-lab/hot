name: Fix PIX message flow
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split PIX messages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text()
          start = s.index('    text_out = (f"<b>PIX gerado com sucesso</b>')
          end_marker = '    await callback.message.answer(text_out, reply_markup=pix_keyboard(order_id, pix_code))'
          end = s.index(end_marker, start) + len(end_marker)
          new = '''    await callback.message.answer(
        f"<b>PIX gerado com sucesso</b> ✅\\n\\n"
        f"<b>Plano:</b> {plan['label']}\\n\\n"
        f"<b>Valor:</b> R$ {plan['amount_cents']/100:.2f}"
    )
    await callback.message.answer(
        "✅ <b>Como realizar o pagamento:</b>\\n\\n"
        "1. Abra o aplicativo do seu banco.\\n"
        "2. Selecione a opção \\\"Pagar\\\" ou \\\"PIX\\\".\\n"
        "3. Escolha \\\"PIX Copia e Cola\\\".\\n"
        "4. Cole a chave da mensagem abaixo..."
    )
    await callback.message.answer("Copie o código abaixo:")
    await callback.message.answer(f"<code>{pix_code}</code>")
    await callback.message.answer(
        "Após efetuar o pagamento, clique no botão abaixo 👇",
        reply_markup=pix_keyboard(order_id, pix_code),
    )'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Split PIX checkout into separate messages'
          git rm .github/workflows/fix_pix_messages_now.yml
          git commit -m 'Remove temporary PIX message workflow'
          git push
