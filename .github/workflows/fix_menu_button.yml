name: Fix start menu button
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Meu acesso button label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          old = 'InlineKeyboardButton(text="/meuacesso", callback_data="status")'
          new = 'InlineKeyboardButton(text="📅 Meu acesso", callback_data="status")'
          if old not in s:
              raise SystemExit('Target button not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py
          git commit -m 'Style Meu acesso start button'
          git push
