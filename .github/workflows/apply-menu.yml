name: Apply menu change

on:
  push:
    paths:
      - '.github/workflows/apply-menu.yml'

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove initial menu options
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/main.py')
          s = p.read_text(encoding='utf-8')
          old = '''def keyboard_menu() -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(inline_keyboard=[\n        [InlineKeyboardButton(text="⭐ Assinar acesso VIP", callback_data="buy")],\n        [InlineKeyboardButton(text="📅 Meu acesso", callback_data="status")],\n        [InlineKeyboardButton(text="ℹ️ Regras e suporte", callback_data="support")],\n    ])'''
          new = '''def keyboard_menu() -> InlineKeyboardMarkup:\n    return InlineKeyboardMarkup(inline_keyboard=[\n        [InlineKeyboardButton(text="⭐ Assinar acesso VIP", callback_data="buy")],\n    ])'''
          if old not in s:
              raise SystemExit('Target menu block not found; no changes applied.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py
          git diff --cached --quiet || git commit -m "Keep only VIP subscription in start menu"
          git push
