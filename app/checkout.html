<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout VIP</title><script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script><style>body{font-family:Arial;background:#0b0b0f;color:#fff;margin:0}.card{max-width:480px;margin:40px auto;padding:24px;background:#17171e;border-radius:20px}input,button,textarea{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:10px}input,textarea{background:#0d0d12;color:#fff;border:1px solid #333}button{cursor:pointer;border:0;font-weight:bold}.plan{background:#262630;color:#fff}.selected{outline:2px solid #fff}#pix{display:none;text-align:center;margin-top:25px}#qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:15px auto}</style></head><body><main class="card"><h1>⭐ Checkout VIP</h1><div id="plans"><button class="plan" data-plan="essential">🟢 VIP Essencial — R$ 8,00</button><button class="plan" data-plan="premium">🔴 VIP Premium — R$ 14,90</button><button class="plan" data-plan="acervo">🔒 VIP Premium + Acervo — R$ 16,90</button><button class="plan" data-plan="full">🎁 Acesso Full + Bônus — R$ 23,90</button></div><form id="form"><input id="name" placeholder="Nome completo" required><input id="email" type="email" placeholder="E-mail" required><input id="phone" placeholder="Telefone" required><input id="cpf" placeholder="CPF/CNPJ" required><button id="go" type="submit">GERAR PIX</button></form><section id="pix"><h2>PIX gerado ✅</h2><div id="qr"></div><textarea id="copy" rows="6" readonly></textarea><button id="copyBtn">COPIAR PIX</button><p id="status">Aguardando pagamento...</p></section></main><script>
const fields=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid','gclid'];let saved=JSON.parse(localStorage.getItem('checkout_utm')||'{}');const qs=new URLSearchParams(location.search);fields.forEach(k=>{if(qs.get(k))saved[k]=qs.get(k)});localStorage.setItem('checkout_utm',JSON.stringify(saved));const utm=()=>({source:saved.utm_source||'',medium:saved.utm_medium||'',campaign:saved.utm_campaign||'',content:saved.utm_content||'',term:saved.utm_term||'',fbclid:saved.fbclid||'',ttclid:saved.ttclid||'',gclid:saved.gclid||''});let plan='';document.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{document.querySelectorAll('.plan').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');plan=b.dataset.plan});document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(!plan)return alert('Escolha um plano.');const go=document.getElementById('go');go.disabled=true;go.textContent='GERANDO PIX...';try{const r=await fetch('/api/checkout/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,customer:{name:name.value,email:email.value,phone:phone.value,cpf:cpf.value},utm:utm()})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Erro ao gerar PIX');copy.value=d.pix.copy_paste;pix.style.display='block';qr.innerHTML='';QRCode.toCanvas(d.pix.copy_paste,{width:250},(_,c)=>{if(c)qr.appendChild(c)});poll(d.transaction_id);pix.scrollIntoView({behavior:'smooth'})}catch(x){alert(x.message)}finally{go.disabled=false;go.textContent='GERAR PIX'}};copyBtn.onclick=async()=>{await navigator.clipboard.writeText(copy.value);copyBtn.textContent='COPIADO ✓';setTimeout(()=>copyBtn.textContent='COPIAR PIX',1800)};function poll(id){const timer=setInterval(async()=>{try{const r=await fetch('/api/checkout/status/'+encodeURIComponent(id));const d=await r.json();if(d.status==='PAID'){clearInterval(timer);status.textContent='Pagamento confirmado! Redirecionando...';location.href='/obrigado'}else if(['EXPIRED','FAILED','CANCELED','REFUNDED'].includes(d.status)){clearInterval(timer);status.textContent='PIX expirado ou cancelado.'}}catch{}} ,3000)}
</script></body></html>
